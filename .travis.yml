language: java

# Since Jackson 2.7, build requires jdk7, although module itself works on jdk6 still (for now)
# Travis no longer provisions openjdk7: the JDK 7 leg installs Azul Zulu 7 on top of
# the openjdk8 image (SEAL_JDK); both legs run Maven 3.8.8 (Travis's Maven 3.9 needs Java 8).
jobs:
  include:
    - jdk: openjdk8
      env: SEAL_JDK=zulu7.56.0.11-ca-jdk7.0.352-linux_x64
    - jdk: openjdk8

before_install:
  - source .travis/seal-setup.sh
install: true
script:
  - mvn -B -V -e -ntp test
  - python3 .travis/surefire-summary.py
after_script:
  - bash .travis/wait-for-log.sh
