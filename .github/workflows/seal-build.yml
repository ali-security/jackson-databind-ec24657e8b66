name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '7'
      - name: Install Maven 3.8.8
        run: |
          mkdir -p "$RUNNER_TEMP/maven"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.8.8/apache-maven-3.8.8-bin.tar.gz | tar xz --strip-components=1 -C "$RUNNER_TEMP/maven"
          echo "$RUNNER_TEMP/maven/bin" >> "$GITHUB_PATH"
      - name: Build jar
        env:
          MAVEN_OPTS: -Dhttps.protocols=TLSv1.2
        run: mvn -B -V -e -ntp -DskipTests clean package
      - uses: actions/upload-artifact@v4
        with:
          name: jackson-databind-jar
          path: target/jackson-databind-2.9.6.jar
          if-no-files-found: error
